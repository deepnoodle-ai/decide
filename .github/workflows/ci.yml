name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need gofmt:"
            echo "$out"
            exit 1
          fi
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -e go.sum ]; then
            git ls-files --error-unmatch go.sum >/dev/null
            git diff --exit-code -- go.sum
          fi

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release notes
        run: scripts/release-notes_test.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.15.3 # brews is deprecated; upgrade deliberately
          args: check
