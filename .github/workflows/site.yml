name: site

# Builds the documentation site on each pull request that can change it, and
# uploads a preview. A v* tag deploys it to decide.deepnoodle.ai. To deploy
# again, run this workflow from a tag: gh workflow run site.yml --ref v0.3.1
on:
  pull_request:
    paths:
      - "site/**"
      - "examples/**"
      - "plugin/.claude-plugin/plugin.json"
      - ".github/workflows/site.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: check and build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  preview:
    name: preview
    needs: build
    # Pull requests from forks get no secrets, and so no preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: upload a preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          npx wrangler versions upload --preview-alias "$ALIAS" | tee "$RUNNER_TEMP/upload.txt"
          url=$(grep -o "https://$ALIAS-[^ ]*workers.dev" "$RUNNER_TEMP/upload.txt" | head -1)
          if [ -z "$url" ]; then
            echo "wrangler printed no preview URL for $ALIAS"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_ENV"
      - name: comment with the link
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- site-preview -->'
          body="$marker
          **Site preview:** $url

          Built from ${{ github.event.pull_request.head.sha }}."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  deploy:
    name: deploy
    needs: build
    # The environment refuses other refs too; this check is a second guard.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The site environment accepts only v* tags.
    environment:
      name: site
      url: https://decide.deepnoodle.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
