name: site

# Builds the documentation site on each pull request that can change it. A
# v* tag deploys it to decide.deepnoodle.ai. To deploy again, run this
# workflow from a tag: gh workflow run site.yml --ref v0.3.1
#
# A pull request can change this file, so no job here that runs for a pull
# request may use a secret. site-preview.yml uploads the preview from main.
on:
  pull_request:
    paths:
      - "site/**"
      - "demo/**"
      - "examples/**"
      - "internal/template/builtin/**"
      - "plugin/.claude-plugin/plugin.json"
      - ".github/workflows/site.yml"
      - ".github/workflows/site-preview.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # shell: bash adds pipefail, so a failed wrangler command fails its step.
    shell: bash
    working-directory: site

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: tapes parse
        run: >-
          docker run --rm -v "$PWD/tapes:/tapes" -w /tapes --entrypoint sh
          ghcr.io/charmbracelet/vhs:v0.12.1@sha256:ea49a6a1c529be83153e88321892b5585964418f0b9055e8c1e0d732194234a3
          -c 'vhs validate *.tape'
      # The build fails, naming the record.sh command, if a tape is not recorded.
      - name: check and build
        run: npm run build
        env:
          # Visits are counted only on the live site, built from a tag.
          CF_BEACON_TOKEN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.CF_BEACON_TOKEN || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  deploy:
    name: deploy
    needs: build
    # The environment refuses other refs too; this check is a second guard.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The site environment accepts only v* tags.
    environment:
      name: site
      url: https://decide.deepnoodle.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
