name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The plugin's version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$have" != "${want%%-*}" ]; then
            echo "plugin/.claude-plugin/plugin.json says $have; set it to ${want%%-*} for $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: go test
        run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.15.3 # brews is deprecated; upgrade deliberately
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
